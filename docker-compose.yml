services:
  postgres:
    image: postgres:17-alpine
    container_name: orbit-chat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
      POSTGRES_DB: chat
    ports:
      - "5432:5432"
    volumes:
      - chat_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat -d chat"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: orbit-chat-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - chat_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Private S3-compatible attachment storage (SeaweedFS). Requests must be signed with the credentials in
  # docker/seaweedfs-s3.json; the app creates the bucket on startup and never makes it public.
  storage:
    image: chrislusf/seaweedfs:3.80
    container_name: orbit-chat-storage
    restart: unless-stopped
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json", "-volume.max=0"]
    ports:
      - "8333:8333"
    volumes:
      - chat_storage_data:/data
      - ./docker/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro

  # Malware scanner for attachments. The first start downloads virus definitions and can take a few minutes.
  clamav:
    image: clamav/clamav-debian:1.4
    container_name: orbit-chat-clamav
    restart: unless-stopped
    ports:
      - "3310:3310"
    volumes:
      - chat_clamav_data:/var/lib/clamav

volumes:
  chat_postgres_data:
  chat_redis_data:
  chat_storage_data:
  chat_clamav_data:
